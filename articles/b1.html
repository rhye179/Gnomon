    <h1 class="post-title">古典統計力学の復習</h1>
    <p class="post-abstract">古典統計力学での扱いを復習する</p>
    <div class="post-body">
        <p>古典統計力学におけるカノニカル分布の方法について確認しよう. 系の自由度を<span class="tex-inline" data-tex="f"></span>としたとき, 非局在粒子の古典分配関数は</p>
        <div class="math-display" data-tex="Z=\frac{1}{n!}\frac{1}{(2\pi\hbar)^f}\int\cdots\int e^{-\beta H}\prod_{i=1}^{f}\mathrm{d}^3\mathbf{p}_i\mathrm{d^3}\mathbf{q}_i"></div>
        で与えられる.
    </div>
