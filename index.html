<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gnomon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-paper: #ffffff;
      --ink: #141518;
      --text-secondary: #525866;
      --text-muted: #868c98;
      --border-hairline: #e2e4e9;
      --surface-subtle: #f7f8fa;
      --accent-cobalt: #1d4ed8;
      --font-sans: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --content-width: 740px;
      /* 六角形（pointy-top）の切り抜き形。小物のアイコンに使い回す */
      --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15.5px;
      line-height: 1.85;
      letter-spacing: 0.015em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .site-wrapper {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 24px 24px 72px;
    }

    /* ---------- ヘッダー ---------- */
    header.site-header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-hairline);
    }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; color: inherit; font: inherit; }
    .brand svg { width: 32px; height: 32px; display: block; }
    .brand-name { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
    .brand-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-left: 2px; }

    nav.site-nav { display: flex; gap: 26px; }
    nav.site-nav button {
      position: relative;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-sans); font-size: 14px; color: var(--text-secondary);
      padding: 2px 0;
    }
    nav.site-nav button:hover { color: var(--ink); }
    nav.site-nav button.active { color: var(--ink); font-weight: 500; }
    nav.site-nav button.active::after {
      content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
      width: 7px; height: 8px; background: var(--ink); clip-path: var(--hex);
    }

    .page-view { display: none; }
    .page-view.active { display: block; }

    /* ---------- トップ：ワードマーク ---------- */
    .hero-fig { margin: 0 -48px; }
    .hero-fig svg { display: block; width: 100%; height: auto; }
    .hero-meta {
      display: flex; justify-content: space-between; gap: 12px;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
      margin-top: 4px;
    }
    @media (max-width: 640px) {
      .hero-fig { margin: 0 -24px; }
    }

    /* 黄金比で縮んでいく六角形の罫線（ノーモン＝相似に育つ図形） */
    svg.hex-rule { display: block; width: 100%; height: 14px; margin: 18px 0 40px; }

    .intro-kicker {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px;
    }
    .intro-heading { font-size: 26px; font-weight: 700; line-height: 1.45; margin-bottom: 14px; letter-spacing: -0.01em; }
    .intro-bio { color: var(--text-secondary); max-width: 620px; }
    .intro-section { margin-bottom: 60px; }

    /* ---------- セクション見出し ---------- */
    .section-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--ink);
    }
    .section-title {
      font-size: 12.5px; font-family: var(--font-mono); font-weight: 500;
      color: var(--ink); letter-spacing: 0.06em;
    }
    .section-title::before {
      content: ""; display: inline-block; width: 8px; height: 9px; margin-right: 8px;
      background: var(--ink); clip-path: var(--hex); vertical-align: -1px;
    }
    .link-btn {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
      background: none; border: none; cursor: pointer;
    }
    .link-btn:hover { color: var(--ink); }

    /* ---------- ノート一覧 ---------- */
    .note-list { list-style: none; }
    .note-item {
      display: grid; grid-template-columns: 72px 1fr; gap: 20px; align-items: start;
      padding: 22px 0; border-bottom: 1px solid var(--border-hairline); cursor: pointer;
    }
    .note-item[hidden] { display: none; }
    .note-item:hover .note-item-title { color: var(--accent-cobalt); }
    .thumb svg { display: block; width: 72px; height: 72px; }
    @media (max-width: 640px) {
      .note-item { grid-template-columns: 56px 1fr; gap: 14px; }
      .thumb svg { width: 56px; height: 56px; }
    }
    .note-meta {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
      font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 6px;
    }
    .note-tag { color: var(--text-secondary); font-size: 11px; }
    .note-tag::before, .fchip::before {
      content: ""; display: inline-block; width: 6px; height: 7px; margin-right: 6px;
      background: currentColor; clip-path: var(--hex); vertical-align: 0;
    }
    .note-item-title { font-size: 17px; font-weight: 600; line-height: 1.5; margin-bottom: 6px; }
    .note-item-abstract { font-size: 14px; color: var(--text-secondary); line-height: 1.75; }

    /* 分野フィルタ */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
    .fchip {
      font-family: var(--font-mono); font-size: 11.5px; color: var(--text-secondary);
      background: #fff; border: 1px solid var(--border-hairline); border-radius: 999px;
      padding: 3px 11px; cursor: pointer;
    }
    .fchip:hover { color: var(--ink); border-color: var(--text-muted); }
    .fchip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

    /* ---------- 記事 ---------- */
    .back-link { margin-bottom: 24px; display: inline-block; }
    .article-header {
      display: grid; grid-template-columns: 1fr 112px; gap: 24px; align-items: end;
      margin-bottom: 36px; padding-bottom: 22px; border-bottom: 1px solid var(--ink);
    }
    .article-header svg { display: block; width: 112px; height: 112px; }
    .article-title { font-size: 25px; font-weight: 700; line-height: 1.45; margin-top: 8px; }
    @media (max-width: 640px) {
      .article-header { grid-template-columns: 1fr 76px; gap: 14px; }
      .article-header svg { width: 76px; height: 76px; }
      .article-title { font-size: 21px; }
    }

    .article-body p { margin-bottom: 20px; }
    .article-body h2 {
      display: flex; align-items: center; gap: 12px;
      font-size: 18px; font-weight: 700; margin: 44px 0 16px;
    }
    .num-box {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border: 1px solid #c9ced8; background: #fff;
    }
    .num-box svg { width: 24px; height: 24px; display: block; }

    /* 定理枠（シンプル） */
    .theorem-box {
      margin: 28px 0; padding: 18px 22px;
      border-left: 2.5px solid var(--ink);
      background-color: rgba(248, 249, 251, 0.85);
    }
    .theorem-label { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; display: block; }

    .math-display { margin: 24px 0; overflow-x: auto; overflow-y: hidden; text-align: center; }

    /* 図枠（シンプル）。図は TikZ で描いてビルド時に SVG にしたもの */
    .figure-block {
      margin: 32px 0; padding: 24px;
      border: 1px solid var(--border-hairline); text-align: center;
    }
    .figure-block svg.tikz { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }
    .tikz-src { margin-top: 12px; text-align: left; }
    .tikz-src summary { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); cursor: pointer; }
    .tikz-src pre {
      margin-top: 8px; padding: 12px 14px; overflow-x: auto;
      background: var(--surface-subtle); border: 1px solid var(--border-hairline);
      font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: var(--text-secondary);
    }
    .figure-caption { margin-top: 12px; font-size: 13px; color: var(--text-secondary); }

    /* ---------- フッター ---------- */
    footer.site-footer { margin-top: 72px; }
    footer.site-footer .hex-rule { margin: 0 0 16px; }
    .colophon {
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px;
      font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
    }

    .katex { font-size: 1.06em; }
    .tex-error {
      font-family: var(--font-mono); font-size: 12px; color: #b42318;
      background: #fef3f2; outline: 1px dashed #b42318; padding: 0 4px;
    }

    /* ---------- 記事本文の追加要素（コード・リスト） ---------- */
    .article-body ul, .article-body ol { margin: 0 0 20px; padding-left: 1.4em; }
    .article-body li { margin-bottom: 6px; }
    .article-body code {
      font-family: var(--font-mono); font-size: 0.86em;
      background: var(--surface-subtle); border: 1px solid var(--border-hairline);
      border-radius: 3px; padding: 0 4px;
    }
    .article-body pre {
      margin: 0 0 20px; padding: 14px 16px; overflow-x: auto;
      background: var(--surface-subtle); border: 1px solid var(--border-hairline);
      font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink);
    }
    .article-body pre code { background: none; border: none; padding: 0; font-size: inherit; }
    .article-body :not(pre) > code { overflow-wrap: anywhere; }   /* 長いコマンドも折り返す */
    .article-body pre { max-width: 100%; }
    .figure-block svg.tikz { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }

    /* 記事：#posts の中で表示中の1本だけを見せる */
    .post { display: none; }
    .post.active { display: block; }
    .post-abstract { display: none; }   /* 説明は一覧カード用 */
    /* PDF ビューア：各ページを画像として縦に並べる（スマホでも表示できる） */
    .pdf-view { margin: 8px 0 24px; border: 1px solid var(--border-hairline); background: var(--surface-subtle); }
    .pdf-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 12px; border-bottom: 1px solid var(--border-hairline); background: #fff;
      font-family: var(--font-mono); font-size: 11.5px; color: var(--text-secondary);
    }
    .pdf-bar a { color: var(--ink); }
    .pdf-pages { padding: 12px; }
    .pdf-pages canvas {
      display: block; width: 100%; height: auto; background: #fff;
      box-shadow: 0 1px 4px rgba(20, 21, 24, 0.12); margin: 0 auto 12px;
    }
    .pdf-msg { padding: 18px 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
    .pdf-msg input { margin-top: 8px; font-family: var(--font-mono); font-size: 12px; max-width: 100%; }
    .pdf-preview { position: relative; display: block; width: 100%; padding: 12px; border: none; background: none; cursor: zoom-in; }
    .pdf-preview canvas { display: block; width: 100%; height: auto; background: #fff; box-shadow: 0 1px 4px rgba(20, 21, 24, 0.12); }
    .pdf-bar button { font-family: var(--font-mono); font-size: 11.5px; color: #fff; background: var(--ink); border: none; border-radius: 999px; padding: 4px 12px; cursor: pointer; }

    /* ---------- 教材リスト（授業回ごとに資料を並べる） ---------- */
    .materials { margin: 8px 0 24px; }
    details.unit { border: 1px solid var(--border-hairline); border-radius: 12px; margin-bottom: 14px; background: #fff; }
    details.unit > summary {
      list-style: none; cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
      padding: 16px 18px; font-size: 16.5px; font-weight: 700; line-height: 1.5;
    }
    details.unit > summary::-webkit-details-marker { display: none; }
    details.unit > summary::before {
      content: ""; flex: none; width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface-subtle) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%23141518' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / 12px no-repeat;
      transform: rotate(-90deg);
    }
    details.unit[open] > summary::before { transform: none; }
    .unit-body { padding: 0 18px 6px 58px; }
    .unit-body > p { font-size: 14px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 10px; }
    @media (max-width: 640px) { .unit-body { padding: 0 16px 6px; } }
    a.res {
      display: flex; align-items: center; gap: 14px; padding: 13px 0;
      border-top: 1px solid var(--border-hairline); color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.5;
    }
    a.res:hover .res-name { color: var(--accent-cobalt); }
    .res-icon { flex: none; width: 30px; height: 30px; display: block; }

    /* ---------- 全画面の PDF リーダー ---------- */
    body.reading { overflow: hidden; }
    .reader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #e7e9ee; }
    .reader[hidden] { display: none; }
    .reader-bar {
      flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: #fff; border-bottom: 1px solid var(--border-hairline);
      font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
    }
    .reader-bar button, .reader-zoom button {
      font-family: var(--font-mono); font-size: 12px; color: var(--ink); background: #fff;
      border: 1px solid var(--border-hairline); border-radius: 999px; padding: 4px 12px; cursor: pointer;
    }
    .reader-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .reader-bar a { color: var(--ink); white-space: nowrap; }
    .reader-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
    .reader-pages { margin: 0 auto; padding: 14px 10px 90px; }
    .rpage { position: relative; width: 100%; background: #fff; margin: 0 auto 14px; box-shadow: 0 1px 5px rgba(20, 21, 24, 0.18); }
    .rpage canvas { display: block; width: 100%; height: 100%; }
    .reader-count {
      position: absolute; top: 64px; right: 14px; padding: 4px 12px; border-radius: 999px;
      background: rgba(20, 21, 24, 0.82); color: #fff; font-family: var(--font-mono); font-size: 12.5px;
    }
    .reader-zoom {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 999px;
      background: #fff; box-shadow: 0 2px 10px rgba(20, 21, 24, 0.18);
      font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
    }
    .reader-zoom span { min-width: 44px; text-align: center; }
    .reader-msg { max-width: 520px; margin: 40px auto; padding: 0 20px; font-size: 13.5px; line-height: 1.8; color: var(--text-secondary); }
    .reader-msg input { margin-top: 10px; font-family: var(--font-mono); font-size: 12px; max-width: 100%; }

    .note-tag.pdf-badge::before { display: none; }
    .note-tag.pdf-badge { border: 1px solid var(--border-hairline); border-radius: 3px; padding: 0 5px; }
    .empty-note { color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <button class="brand" onclick="go('home')" aria-label="Gnomon ホーム">
        <svg class="hexmark" data-text="G" data-detail="2"></svg>
        <span class="brand-name">Gnomon</span>
      </button>
    </header>

    <!-- ===================== 1. トップ ===================== -->
    <main id="page-home" class="page-view active">
      <figure class="hero-fig">
        <svg id="hero" role="img" aria-label="Gnomon"></svg>
      </figure>
      <div class="hero-meta">
        <span>Fig. 0 — Gnomon, packed in hexagons</span>
        <span id="heroCount"></span>
      </div>
      <svg class="hex-rule" aria-hidden="true"></svg>

      <!-- 自己紹介（kicker・見出し・本文）は一旦空白。あとでここに入れる -->

      <section>
        <div class="section-header">
          <span class="section-title">RECENT ARTICLES</span>
          <button class="link-btn" onclick="go('articles')">All articles &rarr;</button>
        </div>
        <ul class="note-list" id="recentList"></ul>
      </section>
    </main>

    <!-- ===================== 2. 記事一覧 ===================== -->
    <section id="page-notes" class="page-view">
      <div class="section-header">
        <span class="section-title" id="notesCount">ALL ARTICLES</span>
      </div>
      <div class="filters" id="filters">
        <button class="fchip on" data-field="all">All</button>
        <button class="fchip" data-field="guide">Guide</button>
        <button class="fchip" data-field="stat">Statistical Mechanics</button>
        <button class="fchip" data-field="quant">Quantum Mechanics</button>
        <button class="fchip" data-field="mech">Analytical Mechanics</button>
        <button class="fchip" data-field="math">Mathematics</button>
      </div>
      <ul class="note-list" id="allNotes"></ul>
    </section>

    <!-- ===================== 3. 記事 =====================
         記事は1本ずつ articles/ フォルダの .html に書き、articles/list.txt にファイル名を足す。
         ページを開いたときに、ここ（#posts）へ読み込まれる。
         一覧カードとトップの RECENT ARTICLES はそこから自動で作られる。
         書き方は articles/_template.html と運用ガイド（#guide）を参照。 -->
    <article id="page-article" class="page-view">
      <button class="link-btn back-link" onclick="go('articles')">&larr; Back to Articles</button>
      <div id="posts"></div>
    </article>

    <footer class="site-footer">
      <svg class="hex-rule" aria-hidden="true"></svg>
      <div class="colophon">
        <span>&copy; 2026 Gnomon</span>
        <span id="texStatus">Typeset with KaTeX</span>
      </div>
    </footer>
  </div>

  <!-- 全画面の PDF リーダー（資料をタップすると開く） -->
  <div class="reader" id="reader" hidden>
    <div class="reader-bar">
      <button id="readerClose">&larr; 戻る</button>
      <span class="reader-title" id="readerTitle"></span>
      <a id="readerOpen" target="_blank" rel="noopener">開く ↗</a>
    </div>
    <div class="reader-scroll" id="readerScroll"><div class="reader-pages" id="readerPages"></div></div>
    <div class="reader-count" id="readerCount"></div>
    <div class="reader-zoom">
      <button data-z="-1" aria-label="縮小">−</button><span id="readerZoom">100%</span><button data-z="1" aria-label="拡大">＋</button>
    </div>
  </div>

  <script>
    // ============================================================
    // ページの切り替え：アドレスの # で決まる（#home / #articles / #a 〜 #z）
    // 記事ごとに #guide のような固有のアドレスで直接開ける。アニメーションなし。
    // ============================================================
    let posts = [];        // 読み込んだ記事（loadPosts が入れる）
    let loadError = '';    // 記事を読み込めなかった理由（'file' / 'list'）

    function go(name) {
      if (location.hash.slice(1) === name) route();
      else location.hash = name;
    }

    function route() {
      const name = location.hash.slice(1) || 'home';
      const post = posts.find(p => p.id === name);
      const page = post ? 'article' : (name === 'articles' ? 'notes' : 'home');
      document.querySelectorAll('.page-view').forEach(el => el.classList.toggle('active', el.id === 'page-' + page));
      posts.forEach(p => p.classList.toggle('active', p === post));
      window.scrollTo(0, 0);
      if (post) post.querySelectorAll('.pdf-view').forEach(showPdf);   // 開いた記事の PDF だけ読み込む
    }
    window.addEventListener('hashchange', route);

    // ---------- 記事を articles/ から読み込む ----------
    //   articles/list.txt に書いたファイル名の順に、articles/（名前）.html を読み込んで #posts に入れる。
    //   記事のアドレスはファイル名（guide.html → #guide）。
    //   cache: 'no-cache' … 記事を更新したら、再読み込みですぐ新しい版が出るように
    async function loadPosts() {
      const box = document.getElementById('posts');
      let names;
      try {
        const res = await fetch('articles/list.txt', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        names = (await res.text()).split('\n')
          .map(s => s.replace(/#.*/, '').trim().replace(/\.html$/, ''))   // # から後ろはメモ
          .filter(Boolean);
      } catch (err) {
        console.error('[articles] list.txt を読み込めませんでした', err);
        loadError = location.protocol === 'file:' ? 'file' : 'list';
        return;
      }
      const texts = await Promise.all(names.map(name =>
        fetch('articles/' + name + '.html', { cache: 'no-cache' })
          .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
          .catch(err => { console.error('[articles] ' + name + '.html を読み込めませんでした', err); return ''; })));
      names.forEach((name, i) => {
        const t = document.createElement('template');
        t.innerHTML = texts[i];
        const p = t.content.querySelector('section.post');
        if (!p) return;
        p.id = name;
        if (!p.dataset.letter) p.dataset.letter = name[0].toUpperCase();   // 省略したらファイル名の頭文字
        box.appendChild(p);
      });
      posts = Array.from(box.querySelectorAll('.post'));
    }

    // ---------- 記事の見出しと一覧カードを #posts から作る ----------
    function metaHtml(p) {
      const d = p.dataset;
      return (d.date ? '<span>' + d.date + '</span>' : '') +
             (d.tag ? '<span class="note-tag">' + d.tag + '</span>' : '') +
             (d.pdf ? '<span class="note-tag pdf-badge">PDF</span>' : '');
    }
    function cardHtml(p) {
      const title = p.querySelector('.post-title');
      const abs = p.querySelector('.post-abstract');
      return '<li class="note-item" data-field="' + (p.dataset.field || '') + '" onclick="go(\'' + p.id + '\')">' +
        '<div class="thumb"><svg class="hexmark" data-text="' + p.dataset.letter + '" data-detail="2"></svg></div>' +
        '<div><div class="note-meta">' + metaHtml(p) + '</div>' +
        '<div class="note-item-title">' + (title ? title.innerHTML : '') + '</div>' +
        '<div class="note-item-abstract">' + (abs ? abs.innerHTML : '') + '</div></div></li>';
    }
    function setupPosts() {
      // 記事が1本もないときに出す文
      const empty = '<li class="empty-note">' + (
        loadError === 'file' ? 'index.html を直接開くと記事を読み込めません。VS Code の「Go Live」で開いてください' :
        loadError === 'list' ? '記事の一覧（articles/list.txt）を読み込めませんでした' :
        'まだ記事がありません') + '</li>';
      // 一覧カード（数式は data-tex のまま複製し、あとで KaTeX がまとめて組む）
      document.getElementById('allNotes').innerHTML = posts.length ? posts.map(cardHtml).join('') : empty;
      const recent = posts.filter(p => p.dataset.date)
        .sort((a, b) => b.dataset.date.localeCompare(a.dataset.date)).slice(0, 3);
      document.getElementById('recentList').innerHTML = recent.length
        ? recent.map(cardHtml).join('')
        : empty;
      setCount('ALL ARTICLES', posts.length);
      // 各記事の頭に見出し（日付・分野・タイトル・六角形の文字）を付ける
      posts.forEach(p => {
        const h = document.createElement('div');
        h.className = 'article-header';
        h.innerHTML = '<div><div class="note-meta">' + metaHtml(p) + '</div></div>' +
          '<svg class="hexmark" data-text="' + p.dataset.letter + '" data-detail="1" aria-hidden="true"></svg>';
        const title = p.querySelector('.post-title');
        if (title) { title.classList.add('article-title'); h.firstChild.appendChild(title); }
        p.prepend(h);
        const body = p.querySelector('.post-body');
        if (body) body.classList.add('article-body');   // 本文の見た目（段落・見出し・コード）を当てる
        // data-pdf="pdfs/b.pdf" と書いた記事は、本文の最後に PDF ビューアを付ける
        if (body && p.dataset.pdf) {
          const v = document.createElement('div');
          v.className = 'pdf-view';
          v.dataset.src = p.dataset.pdf;
          body.appendChild(v);
        }
      });
    }

    // ---------- 分野フィルタ ----------
    function setCount(label, n) {
      document.getElementById('notesCount').textContent = label + ' (' + String(n).padStart(2, '0') + ')';
    }
    document.querySelectorAll('#filters .fchip').forEach(chip => {
      chip.addEventListener('click', () => {
        const f = chip.dataset.field;
        document.querySelectorAll('#filters .fchip').forEach(c => c.classList.toggle('on', c === chip));
        let n = 0;
        document.querySelectorAll('#allNotes .note-item').forEach(li => {
          const show = f === 'all' || li.dataset.field === f;
          li.hidden = !show;
          if (show) n++;
        });
        setCount(f === 'all' ? 'ALL ARTICLES' : chip.textContent.toUpperCase(), n);
      });
    });

    // ============================================================
    // PDF ビューア（PDF.js）
    //   <div class="pdf-view" data-src="pdfs/xxx.pdf"></div> を置くと、その PDF の全ページを
    //   画像として縦に並べて表示する。スマホのブラウザは PDF をページに埋め込めないことが
    //   多いので、PDF.js で1ページずつキャンバスに描いている。
    //   PDF.js は PDF のある記事を開いたときだけ読み込む（トップは軽いまま）。
    // ============================================================
    const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    let pdfjsReady = null;
    function loadScript(src) {
      return new Promise((ok, ng) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = ng;
        document.head.appendChild(s);
      });
    }
    function loadPdfJs() {
      // worker もふつうの script として読み込み、メインスレッドで動かす（設定いらずで確実）
      if (!pdfjsReady) pdfjsReady = loadScript(PDFJS + 'pdf.worker.min.js')
        .then(() => loadScript(PDFJS + 'pdf.min.js'))
        .then(() => window.pdfjsLib);
      return pdfjsReady;
    }

    // ---------- 記事の中の PDF：1ページ目を見本として出し、タップで全画面リーダーへ ----------
    async function previewPdf(view, source, label) {
      view.innerHTML = '<div class="pdf-bar"><span>PDF · ' + label + ' · 読み込み中…</span></div>';
      const lib = await loadPdfJs();
      const data = source.data ? { data: source.data.slice() } : source;   // リーダーでも使うので複製
      const doc = await lib.getDocument(data).promise;
      const page = await doc.getPage(1);
      view.innerHTML = '<div class="pdf-bar"><span>PDF · ' + label + ' · ' + doc.numPages + ' ページ</span>' +
        '<button type="button">全画面で読む</button></div><button type="button" class="pdf-preview" aria-label="全画面で読む"></button>';
      const box = view.querySelector('.pdf-preview');
      const base = page.getViewport({ scale: 1 });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: Math.max(240, box.clientWidth - 24) / base.width * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      box.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      doc.destroy();
      const open = () => openReader(source, label);
      box.addEventListener('click', open);
      view.querySelector('.pdf-bar button').addEventListener('click', open);
    }

    function showPdf(view) {
      if (view.dataset.state) return;            // 一度描いたら描き直さない
      view.dataset.state = 'loading';
      const src = view.dataset.src;
      const name = view.dataset.title || src.split('/').pop();
      previewPdf(view, src, name).then(() => { view.dataset.state = 'done'; }).catch(err => {
        console.error('[PDF]', src, err);
        view.dataset.state = 'error';
        view.innerHTML =
          '<div class="pdf-bar"><span>PDF · ' + name + '</span></div>' +
          '<div class="pdf-msg">PDF を読み込めませんでした。<code>' + src + '</code> が GitHub にアップロードされているか確認してください。<br>' +
          '手元の PDF で表示を試す：<br><input type="file" accept="application/pdf"></div>';
        view.querySelector('input').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          f.arrayBuffer().then(buf => previewPdf(view, { data: new Uint8Array(buf) }, f.name))
            .catch(() => { view.querySelector('.pdf-bar span').textContent = 'PDF · ' + f.name + ' · 表示できませんでした'; });
        });
      });
    }

    // ============================================================
    // 全画面の PDF リーダー
    //   ・ページは画面に近づいたものから順に描く（長い PDF でも重くならない）
    //   ・右上に「今のページ / 全ページ」、下に拡大・縮小
    //   ・スマホの「戻る」でも閉じられる
    // ============================================================
    const R = {
      el: document.getElementById('reader'),
      scroll: document.getElementById('readerScroll'),
      pages: document.getElementById('readerPages'),
      count: document.getElementById('readerCount'),
      doc: null, observer: null, zoom: 1, pushed: false
    };
    const ZOOMS = [1, 1.5, 2, 3];

    async function openReader(source, title) {
      R.el.hidden = false;
      document.body.classList.add('reading');
      document.getElementById('readerTitle').textContent = title;
      const openLink = document.getElementById('readerOpen');
      if (typeof source === 'string') { openLink.href = source; openLink.hidden = false; } else openLink.hidden = true;
      R.pages.innerHTML = '';
      R.count.textContent = '… / …';
      setZoom(1);
      try { history.pushState({ reader: true }, ''); R.pushed = true; } catch (e) { R.pushed = false; }
      try {
        const lib = await loadPdfJs();
        const doc = await lib.getDocument(source.data ? { data: source.data.slice() } : source).promise;
        if (R.el.hidden) { doc.destroy(); return; }   // 読み込み中に閉じられた
        R.doc = doc;
        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const v = page.getViewport({ scale: 1 });
          const div = document.createElement('div');
          div.className = 'rpage';
          div.dataset.i = i;
          div.style.aspectRatio = v.width + ' / ' + v.height;   // 描く前から正しい高さを確保
          R.pages.appendChild(div);
        }
        R.observer = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) drawPage(e.target); }),
          { root: R.scroll, rootMargin: '800px 0px' });
        R.pages.querySelectorAll('.rpage').forEach(d => R.observer.observe(d));
        updateCount();
      } catch (err) {
        console.error('[PDF]', source, err);
        R.count.textContent = '';
        R.pages.innerHTML = '<div class="reader-msg">PDF を読み込めませんでした。<br>' +
          (typeof source === 'string' ? '<code>' + source + '</code> が GitHub にアップロードされているか確認してください。<br>' : '') +
          '手元の PDF で表示を試す：<br><input type="file" accept="application/pdf"></div>';
        R.pages.querySelector('input').addEventListener('change', e => {
          const f = e.target.files[0];
          if (f) f.arrayBuffer().then(buf => { closeReader(true); openReader({ data: new Uint8Array(buf) }, f.name); });
        });
      }
    }

    async function drawPage(div) {
      if (div.dataset.done || !R.doc) return;
      div.dataset.done = '1';
      const page = await R.doc.getPage(Number(div.dataset.i));
      const base = page.getViewport({ scale: 1 });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      // 画面より少し高い解像度で描いておくと、拡大しても文字がつぶれにくい
      const target = Math.min(2200, R.scroll.clientWidth * dpr * 1.6);
      const vp = page.getViewport({ scale: target / base.width });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      div.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }

    function updateCount() {
      const list = R.pages.querySelectorAll('.rpage');
      if (!list.length) return;
      const line = R.scroll.scrollTop + R.scroll.clientHeight * 0.3;
      let cur = 1;
      list.forEach(d => { if (d.offsetTop <= line) cur = Number(d.dataset.i); });
      R.count.textContent = cur + ' / ' + list.length;
    }
    R.scroll.addEventListener('scroll', updateCount, { passive: true });

    function setZoom(z) {
      const old = R.zoom;
      R.zoom = z;
      R.pages.style.width = (z * 100) + '%';
      R.pages.style.maxWidth = z === 1 ? '860px' : 'none';
      document.getElementById('readerZoom').textContent = Math.round(z * 100) + '%';
      if (old !== z) R.scroll.scrollTop = R.scroll.scrollTop * z / old;   // 読んでいた位置を保つ
    }
    document.querySelectorAll('.reader-zoom button').forEach(b => b.addEventListener('click', () => {
      const i = ZOOMS.indexOf(R.zoom) + Number(b.dataset.z);
      if (i >= 0 && i < ZOOMS.length) setZoom(ZOOMS[i]);
    }));

    function closeReader(fromHistory) {
      if (R.el.hidden) return;
      if (!fromHistory && R.pushed) { R.pushed = false; history.back(); return; }   // popstate 経由で閉じる
      R.pushed = false;
      R.el.hidden = true;
      document.body.classList.remove('reading');
      if (R.observer) R.observer.disconnect();
      if (R.doc) R.doc.destroy();
      R.doc = null; R.observer = null;
      R.pages.innerHTML = '';
    }
    document.getElementById('readerClose').addEventListener('click', () => closeReader(false));
    window.addEventListener('popstate', () => closeReader(true));

    // ---------- 教材リスト：アイコンを付け、PDF はタップでリーダーを開く ----------
    const ICON_PDF = '<svg class="res-icon" viewBox="0 0 30 30" aria-hidden="true"><path d="M8 3.5h11l5.5 5.5v17.5H8z" fill="#fff" stroke="#141518" stroke-width="1.4" stroke-linejoin="round"/><path d="M19 3.5V9h5.5" fill="none" stroke="#141518" stroke-width="1.4" stroke-linejoin="round"/><rect x="3" y="14" width="18" height="8.5" rx="1.6" fill="#141518"/><text x="12" y="20.6" font-size="6.4" font-family="JetBrains Mono, monospace" font-weight="700" fill="#fff" text-anchor="middle">PDF</text></svg>';
    const ICON_LINK = '<svg class="res-icon" viewBox="0 0 30 30" aria-hidden="true"><path d="M13 7H7v16h16v-6" fill="none" stroke="#141518" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 5.5h7.5V13M24.5 5.5 14 16" fill="none" stroke="#141518" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const isPdf = href => /\.pdf($|[?#])/i.test(href || '');
    function setupMaterials() {
      document.querySelectorAll('.materials a.res').forEach(a => {
        const href = a.getAttribute('href');
        a.innerHTML = (isPdf(href) ? ICON_PDF : ICON_LINK) + '<span class="res-name">' + a.innerHTML + '</span>';
        if (!isPdf(href)) { a.target = '_blank'; a.rel = 'noopener'; }
      });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a.res');
      if (!a || !isPdf(a.getAttribute('href'))) return;
      e.preventDefault();
      openReader(a.getAttribute('href'), (a.querySelector('.res-name') || a).textContent.trim());
    });

    // ---------- KaTeX：data-tex から描画。1式エラーでも他は止めない ----------
    function typesetAll() {
      const status = document.getElementById('texStatus');
      if (typeof katex === 'undefined') { status.textContent = 'KaTeX failed to load'; return; }
      let ok = 0, total = 0;
      function render(el, display) {
        const tex = el.getAttribute('data-tex');
        if (!tex) return;
        total++;
        try {
          katex.render(tex, el, { displayMode: display, throwOnError: true });
          ok++;
        } catch (e) {
          el.textContent = tex;
          el.classList.add('tex-error');
          el.title = e.message;
          console.error('[KaTeX]', e.message, '\n', tex);
        }
      }
      document.querySelectorAll('.tex-inline').forEach(el => render(el, false));
      document.querySelectorAll('.math-display').forEach(el => render(el, true));
      status.textContent = 'Typeset with KaTeX · ' + ok + '/' + total;
    }

    // ============================================================
    // 六角形フラクタル文字
    //   1) 文字をキャンバスに描き「どこが文字の中か」を調べる
    //   2) 大きな六角形から敷き、すき間を半分の大きさで、さらに半分で…と埋める
    //   3) トップのワードマークだけ、周りに細かい六角形の「粉」を散らす
    //   乱数は座標から決まるので、毎回同じ形になる。動きは一切なし。
    // ============================================================
    const INK = ['#141518', '#2f333d', '#525866', '#868c98', '#b9bec8'];
    const ACCENT = '#1d4ed8';

    function hash(a, b, c) {
      let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    function gradient(stops, t) {
      t = Math.min(1, Math.max(0, t)) * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i;
      const a = hexRgb(stops[i]), b = hexRgb(stops[i + 1]);
      return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',') + ')';
    }
    const r2 = v => Math.round(v * 100) / 100;
    function hexPoints(x, y, R) {
      const p = [];
      for (let k = 0; k < 6; k++) {
        const a = Math.PI / 180 * (60 * k - 90);
        p.push(r2(x + R * Math.cos(a)) + ',' + r2(y + R * Math.sin(a)));
      }
      return p.join(' ');
    }

    // 文字の形を作る。hero は余白つき、mark は 128×128 の六角枠に収める
    function buildMask(text, kind) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d', { willReadFrequently: true });
      const fontOf = px => '800 ' + px + 'px Inter, "Noto Sans JP", sans-serif';
      const measure = px => {
        ctx.font = fontOf(px);
        if ('letterSpacing' in ctx) ctx.letterSpacing = Math.round(px * 0.02) + 'px';
        return ctx.measureText(text);
      };
      let fontSize = 240, W = 128, H = 128;
      if (kind === 'mark') {
        const m0 = measure(100);
        const big = Math.max(m0.actualBoundingBoxLeft + m0.actualBoundingBoxRight, m0.actualBoundingBoxAscent + m0.actualBoundingBoxDescent);
        fontSize = 100 * 116 / big;  // 128×128 の枠いっぱいに
      }
      const m = measure(fontSize);
      const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      const inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      if (kind === 'hero') {
        W = Math.ceil((inkW + 160) / 32) * 32;
        H = Math.ceil((inkH + 90) / 32) * 32;
      }
      c.width = W; c.height = H;
      measure(fontSize);
      ctx.fillStyle = '#000';
      ctx.fillText(text, (W - inkW) / 2 + m.actualBoundingBoxLeft, (H - inkH) / 2 + m.actualBoundingBoxAscent);
      const px = ctx.getImageData(0, 0, W, H).data;
      const inside = new Uint8Array(W * H);
      for (let i = 0; i < W * H; i++) inside[i] = px[i * 4 + 3] >= 128 ? 1 : 0;
      return { W, H, inside, cover: makeCover(inside, W, H) };
    }

    // 積分画像：任意の長方形に含まれる「1」の割合を一瞬で求める
    function makeCover(bits, W, H) {
      const S = new Float64Array((W + 1) * (H + 1));
      for (let j = 0; j < H; j++) {
        let row = 0;
        for (let i = 0; i < W; i++) {
          row += bits[j * W + i];
          S[(j + 1) * (W + 1) + i + 1] = S[j * (W + 1) + i + 1] + row;
        }
      }
      return (x0, y0, w) => {
        const a = Math.max(0, Math.floor(x0)), b = Math.max(0, Math.floor(y0));
        const c = Math.min(W, Math.ceil(x0 + w)), d = Math.min(H, Math.ceil(y0 + w));
        if (c <= a || d <= b) return 0;
        return (S[d * (W + 1) + c] - S[b * (W + 1) + c] - S[d * (W + 1) + a] + S[b * (W + 1) + a]) / ((c - a) * (d - b));
      };
    }

    function markOcc(occ, W, H, x, y, R) {
      const rc = Math.ceil(R);
      for (let yy = Math.max(0, Math.floor(y - rc)); yy < Math.min(H, y + rc); yy++)
        for (let xx = Math.max(0, Math.floor(x - rc)); xx < Math.min(W, x + rc); xx++)
          if ((xx - x) ** 2 + (yy - y) ** 2 <= R * R) occ[yy * W + xx] = 1;
    }

    // 多段の六角形パッキング
    function packHex(M, Rtop, Rmin) {
      const occ = new Uint8Array(M.W * M.H);
      const hexes = [];
      let R = Rtop, level = 0;
      while (R >= Rmin) {
        const occCover = makeCover(occ, M.W, M.H);
        const last = R / 2 < Rmin;
        const dx = Math.sqrt(3) * R, dy = 1.5 * R, t = 1.6 * R;
        const placed = [];
        for (let j = 0, y = 0; y < M.H + R; j++, y = j * dy) {
          for (let x = (j % 2) * dx / 2; x < M.W + R; x += dx) {
            const c = M.cover(x - t / 2, y - t / 2, t);
            if (!(c > 0.96 || (last && c > 0.5))) continue;
            if (occCover(x - t / 2, y - t / 2, t) > 0.02) continue;
            if (!last && hash(Math.round(x), Math.round(y), Math.round(R * 10)) < 0.22) continue; // わざと空けて下の段へ
            placed.push([x, y]);
          }
        }
        placed.forEach(([x, y]) => {
          const t = x / M.W * 0.68 + y / M.H * 0.32 + (hash(x * 3 + 4, y * 5, 17) - 0.5) * 0.2;
          hexes.push({ x, y, R, level, fill: gradient(INK, t) });
          markOcc(occ, M.W, M.H, x, y, R);
        });
        R /= 2; level++;
      }
      return { hexes, occ };
    }

    // 距離変換（Felzenszwalb）：各点から「1」の領域までの距離
    function edt(bits, W, H) {
      const INF = 1e20, out = new Float64Array(W * H);
      for (let i = 0; i < W * H; i++) out[i] = bits[i] ? 0 : INF;
      const n = Math.max(W, H), f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
      function pass(len, get, set) {
        for (let q = 0; q < len; q++) f[q] = get(q);
        let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
        for (let q = 1; q < len; q++) {
          let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
          while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
          k++; v[k] = q; z[k] = s; z[k + 1] = INF;
        }
        k = 0;
        for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; set(q, (q - v[k]) * (q - v[k]) + f[v[k]]); }
      }
      for (let x = 0; x < W; x++) pass(H, y => out[y * W + x], (y, val) => { out[y * W + x] = val; });
      for (let y = 0; y < H; y++) pass(W, x => out[y * W + x], (x, val) => { out[y * W + x] = val; });
      for (let i = 0; i < W * H; i++) out[i] = Math.sqrt(out[i]);
      return out;
    }

    // トップのワードマーク：文字＋周りの粉
    function renderHero() {
      const svg = document.getElementById('hero');
      const M = buildMask('Gnomon', 'hero');
      const { hexes, occ } = packHex(M, 20, 0.9);

      // いちばん大きい段の中から1つだけ、コバルトの六角形を混ぜる
      let pick = null, best = -1;
      hexes.forEach(h => { if (h.level === 0) { const v = hash(Math.round(h.x), Math.round(h.y), 99); if (v > best) { best = v; pick = h; } } });
      if (pick) pick.fill = ACCENT;

      const out = hexes.map(h => '<polygon points="' + hexPoints(h.x, h.y, h.R * 0.9) + '" fill="' + h.fill + '"/>');

      // 粉：文字から離れるほど、まばらに・小さく・薄く
      const dist = edt(M.inside, M.W, M.H);
      let dust = 0;
      [5, 3, 1.8].forEach((R, li) => {
        const occCover = makeCover(occ, M.W, M.H);
        const dx = Math.sqrt(3) * R * 1.15, dy = 1.5 * R * 1.15;
        for (let j = 0, y = 0; y < M.H; j++, y = j * dy) {
          for (let x = (j % 2) * dx / 2; x < M.W; x += dx) {
            const d = dist[Math.min(M.H - 1, Math.floor(y)) * M.W + Math.min(M.W - 1, Math.floor(x))];
            if (d < R * 2.2) continue;
            const lam = 9 + li * 7;
            const edge = Math.min(1, Math.min(x, M.W - x, y, M.H - y) / 50);   // 端に向かって消える
            const p = 0.32 * Math.exp(-d / lam) * (0.5 + 0.9 * x / M.W) * edge;
            if (hash(Math.round(x * 10), Math.round(y * 10), 7 + li) > p) continue;
            if (occCover(x - R, y - R, 2 * R) > 0.01) continue;
            const op = r2(0.14 + 0.5 * Math.exp(-d / 25));
            out.push('<polygon points="' + hexPoints(x, y, R * 0.85) + '" fill="#141518" fill-opacity="' + op + '"/>');
            markOcc(occ, M.W, M.H, x, y, R);
            dust++;
          }
        }
      });

      svg.setAttribute('viewBox', '0 0 ' + M.W + ' ' + M.H);
      svg.innerHTML = out.join('');
      document.getElementById('heroCount').textContent = (hexes.length + dust).toLocaleString() + ' hexagons';
    }

    // ロゴ・サムネイル・記事見出し・節番号用：文字（数字）だけを六角形で組む
    function renderMark(svg) {
      const M = buildMask(svg.dataset.text, 'mark');
      const detail = Number(svg.dataset.detail || 2);
      const top = Number(svg.dataset.top || 10);
      const { hexes } = packHex(M, top, detail * 0.9);
      const out = [];
      hexes.forEach(h => out.push('<polygon points="' + hexPoints(h.x, h.y, h.R * 0.9) + '" fill="' + h.fill + '"/>'));
      svg.setAttribute('viewBox', '0 0 128 128');
      svg.innerHTML = out.join('');
    }

    // 罫線：黄金比で縮んでいく六角形の列 → 細い線
    function renderRule(svg) {
      const W = 740, y = 7, out = [];
      let x = 6, R = 6;
      for (let i = 0; i < 7; i++) {
        out.push('<polygon points="' + hexPoints(x, y, R) + '" fill="#141518"/>');
        const next = R / 1.618;
        x += R * 0.866 + next * 0.866 + 3;
        R = next;
      }
      out.push('<line x1="' + r2(x + 2) + '" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#141518" stroke-width="1"/>');
      svg.setAttribute('viewBox', '0 0 ' + W + ' 14');
      svg.setAttribute('preserveAspectRatio', 'xMinYMid meet');
      svg.innerHTML = out.join('');
    }

    function renderAll() {
      renderHero();
      document.querySelectorAll('svg.hexmark').forEach(renderMark);
      document.querySelectorAll('svg.hex-rule').forEach(renderRule);
    }

    // ============================================================
    // 起動：記事を読み込む → 見出し・一覧を作る → 表示を切り替える → 数式を組む
    //   六角形は、記事が入り、Inter の極太（800）が読み込まれてから描く
    // ============================================================
    const pageReady = new Promise(ok => document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', ok) : ok());   // KaTeX（defer）の読み込み待ち
    const fontReady = (document.fonts ? document.fonts.load('800 100px Inter') : Promise.resolve()).catch(() => {});
    const postsReady = loadPosts().then(() => { setupPosts(); setupMaterials(); route(); });
    Promise.all([postsReady, pageReady]).then(typesetAll);
    Promise.all([postsReady, fontReady]).then(renderAll);
  </script>
</body>
</html>
